name: Setup Python Environment with uv
description: Sets up Python, installs uv, and creates the virtual environment.
inputs:
  only-dev:
    description: Whether to install only dev dependencies
    required: false
    default: 'false'
  python-version:
    description: Explicit Python version to install
    required: false
    default: ''

runs:
  using: composite
  steps:
  - name: Install uv
    uses: astral-sh/setup-uv@v7
    with:
      enable-cache: true

  - name: Set up Python from matrix
    if: ${{ inputs.python-version != '' }}
    uses: actions/setup-python@v7
    with:
      python-version: ${{ inputs.python-version }}

  - name: Set up Python from pyproject
    if: ${{ inputs.python-version == '' }}
    uses: actions/setup-python@v7
    with:
      python-version-file: pyproject.toml

  - name: Install dependencies
    shell: bash
    run: |-
      if [[ "${{ inputs.only-dev }}" == "true" ]]; then
        uv sync --only-dev
      else
        uv sync
      fi